<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Masuk — MitaElektronik</title>
    <meta
      name="description"
      content="MitaElektronik: toko online elektronik, gaming, dan fashion."
    />
    <link rel="icon" type="image/png" sizes="512x512" href="assets/mita-techno-favicon.png" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/auth.css" />
  </head>
  <body data-page="login">
    <div id="site-header"></div>

    <main class="auth-page">
      <div class="auth-wrap">
        <div class="auth-visual">
          <div>
            <h1>Selamat datang kembali.</h1>
            <p>Masuk untuk melihat riwayat pesanan dan checkout lebih cepat.</p>
          </div>
          <ul>
            <li>
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="m3.5 7 8.5-4 8.5 4v10L12 21l-8.5-4V7Z" />
                <path d="m3.8 7.2 8.2 4 8.2-4M12 11.2V21" />
              </svg>
              <span>Pantau pesananmu</span>
            </li>
            <li>
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="m13.5 2.8-8 10h6l-1 8.4 8-11h-6l1-7.4Z" />
              </svg>
              <span>Data pengiriman terisi otomatis</span>
            </li>
            <li>
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M3 4h2l2.2 11.2a2 2 0 0 0 2 1.6h8.5a2 2 0 0 0 1.9-1.4L21 8H6" />
                <circle cx="10" cy="20" r="1" />
                <circle cx="18" cy="20" r="1" />
              </svg>
              <span>Keranjang tetap tersimpan</span>
            </li>
          </ul>
        </div>
        <div class="auth-form">
          <h2>Masuk ke akunmu</h2>
          <p class="sub">Gunakan email dan password yang kamu daftarkan.</p>
          <form id="login-form" novalidate>
            <div id="form-message" class="form-message" role="alert"></div>
            <div class="form-group">
              <label for="email">Email</label
              ><input
                id="email"
                name="email"
                type="email"
                autocomplete="email"
                placeholder="nama@email.com"
                required
              />
            </div>
            <div class="form-group">
              <label for="password">Password</label>
              <div class="password-box">
                <input
                  id="password"
                  name="password"
                  type="password"
                  autocomplete="current-password"
                  required
                /><button
                  type="button"
                  id="toggle-password"
                  aria-label="Tampilkan password"
                >
                  <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M2.8 12s3.2-6 9.2-6 9.2 6 9.2 6-3.2 6-9.2 6-9.2-6-9.2-6Z" />
                    <circle cx="12" cy="12" r="2.7" />
                  </svg>
                </button>
              </div>
            </div>
            <div class="row-between">
              <label
                ><input type="checkbox" name="remember" /> Ingat email
                saya</label
                ><button type="button" id="forgot-password">Lupa password?</button>
            </div>
            <button type="submit" class="btn btn-primary btn-block">
              Masuk
            </button>
          </form>
          <p class="switch">
            Belum punya akun? <a href="register.html">Daftar sekarang</a>
          </p>
        </div>
      </div>
    </main>

    <div id="site-footer"></div>
    <script src="js/products.js"></script>
    <script src="js/common.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
